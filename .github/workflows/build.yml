name: Build Moon Menu V2
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'
      - name: Build
        run: gradle build
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: moon-menu-v2-${{ github.run_number }}
          path: build/libs/*.jar
          if-no-files-found: error
      - name: Publish direct JAR
        uses: softprops/action-gh-release@v2
        with:
          tag_name: moon-menu-v2-latest
          name: Moon Menu V2 latest
          body: Fresh independent Moon Menu V2 build for Minecraft 26.2 Fabric.
          prerelease: true
          files: build/libs/*.jar
          fail_on_unmatched_files: true
