name: Build Moon Menu V2
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'
      - name: Build and test
        run: gradle build
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: moon-menu-v2-2.0.0
          path: build/libs/moon-menu-2.0.0.jar
