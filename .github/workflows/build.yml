name: Build Moon Menu V2
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'
      - name: Build and test
        run: gradle build
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: moon-menu-v2-${{ github.run_number }}
          path: build/libs/Moon Menu V*.jar
      - name: Publish direct JAR download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="moon-menu-v2-latest"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Moon Menu V2 latest" --notes "Latest build of Moon Menu V2 for Minecraft 26.2 Fabric." --prerelease
          fi
          JAR=$(find build/libs -maxdepth 1 -type f -name 'Moon Menu V*.jar' -print -quit)
          test -n "$JAR"
          gh release upload "$TAG" "$JAR" --clobber
